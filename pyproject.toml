[project]
name = "dispertorch"
version = "0.1.1"
description = "Differentiable refractive-index dispersion models built on PyTorch nn.Module"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispertorch"]
